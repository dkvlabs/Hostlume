[workspace]
resolver = "2"
members = [
    "crates/monitor-core",
    "crates/monitor-history",
    "crates/monitor-storage",
    "crates/monitor-platform-macos",
    "crates/monitor-platform-windows",
    "crates/monitor-platform-linux",
    "apps/desktop/src-tauri", "crates/monitor-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/dkvlabs/Hostlume"

[workspace.dependencies]
monitor-core = { path = "crates/monitor-core" }
monitor-history = { path = "crates/monitor-history" }
monitor-storage = { path = "crates/monitor-storage" }
monitor-platform-macos = { path = "crates/monitor-platform-macos" }
monitor-platform-windows = { path = "crates/monitor-platform-windows" }
monitor-platform-linux = { path = "crates/monitor-platform-linux" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
thiserror = "2.0.21"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
