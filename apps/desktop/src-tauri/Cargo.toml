[package]
name = "app"
description = "APP_NAME desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-single-instance = "2.5.4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
monitor-core = { workspace = true }
monitor-platform-macos = { workspace = true }
monitor-platform-windows = { workspace = true }
monitor-platform-linux = { workspace = true }
