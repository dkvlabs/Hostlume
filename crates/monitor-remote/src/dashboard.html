<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Hostlume — read-only monitor</title>
<style>
  /* Original design tokens (docs/design.md §2) — not derived from any
     reference application's assets. */
  :root {
    --bg: #101318; --surface: #1A2028; --surface-raised: #222A34;
    --stroke: #313B47; --text: #F2F5F8; --muted: #A6B0BD;
    --accent: #67D4D0; --warning: #F4BC6C; --critical: #FB7C80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  header { padding: 20px 24px 8px; }
  header h1 { font-size: 18px; margin: 0 0 2px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main { padding: 16px 24px 32px; max-width: 1080px; margin: 0 auto; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px;
           font-size: 12px; border: 1px solid var(--stroke); }
  .badge.live { color: var(--accent); border-color: var(--accent); }
  .badge.down { color: var(--critical); border-color: var(--critical); }
  .cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 16px; }
  .card { background: var(--surface); border: 1px solid var(--stroke);
          border-radius: 12px; padding: 16px; }
  .card h2 { margin: 0 0 8px; font-size: 13px; font-weight: 500;
             color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .value { font-size: 26px; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  form { display: flex; gap: 8px; max-width: 520px; margin-top: 20px; }
  input { flex: 1; background: var(--surface); color: var(--text);
          border: 1px solid var(--stroke); border-radius: 8px; padding: 10px 12px;
          font-size: 14px; }
  button { background: var(--accent); color: #101318; border: 0; border-radius: 8px;
           padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .error { color: var(--critical); font-size: 13px; margin-top: 8px; min-height: 1em; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--stroke); }
  th { color: var(--muted); font-weight: 500; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Hostlume <span id="status" class="badge down">disconnected</span></h1>
  <p>Read-only view. This dashboard cannot control anything on the host.</p>
</header>
<main>
  <form id="login">
    <input id="token" type="password" autocomplete="off"
           placeholder="Access token (from the desktop app: Settings → Remote)" />
    <button type="submit">Connect</button>
  </form>
  <p id="error" class="error" role="alert"></p>

  <section id="view" class="hidden">
    <div class="cards">
      <div class="card"><h2>CPU</h2><div class="value" id="cpu">—</div><div class="sub">total usage</div></div>
      <div class="card"><h2>Memory</h2><div class="value" id="mem">—</div><div class="sub" id="memSub">used / total</div></div>
      <div class="card"><h2>Network</h2><div class="value" id="net">—</div><div class="sub">busiest interface, ↓/↑</div></div>
      <div class="card"><h2>Battery</h2><div class="value" id="bat">—</div><div class="sub">charge</div></div>
    </div>
    <table aria-label="Latest readings">
      <thead><tr><th scope="col">Metric</th><th scope="col">Entity</th><th scope="col" style="text-align:right">Value</th><th scope="col">Unit</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script>
"use strict";
// Same-origin only; the session cookie is HttpOnly + SameSite=Strict and
// the token itself never appears in any URL.
const $ = (id) => document.getElementById(id);
const fmtBytes = (n) => {
  const u = ["B", "KiB", "MiB", "GiB", "TiB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i += 1; }
  return (i === 0 ? n : n.toFixed(1)) + " " + u[i];
};
function setStatus(live) {
  $("status").textContent = live ? "live" : "disconnected";
  $("status").className = "badge " + (live ? "live" : "down");
}
let source = null;
function connect() {
  if (source) source.close();
  source = new EventSource("/api/v1/stream");
  source.addEventListener("snapshot", (event) => {
    setStatus(true);
    $("error").textContent = "";
    render(JSON.parse(event.data));
  });
  source.addEventListener("wait", () => setStatus(false));
  source.onerror = () => setStatus(false);
}
$("login").addEventListener("submit", async (submit) => {
  submit.preventDefault();
  $("error").textContent = "";
  try {
    const response = await fetch("/api/v1/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: $("token").value }),
    });
    if (!response.ok) {
      $("error").textContent =
        response.status === 401 ? "Invalid token." :
        response.status === 429 ? "Too many attempts — wait a moment." :
        "Connection failed (" + response.status + ").";
      return;
    }
    $("token").value = "";
    $("view").classList.remove("hidden");
    connect();
  } catch {
    $("error").textContent = "Connection failed.";
  }
});
function reading(payload, metricId, entityId) {
  return (payload.readings || []).find(
    (r) => r.metric_id === metricId && (!entityId || r.entity_id === entityId)
  );
}
function render(payload) {
  const cpu = reading(payload, "cpu.total.usage");
  $("cpu").textContent = cpu ? cpu.value.toFixed(0) + " %" : "—";
  const used = reading(payload, "memory.physical.used");
  const total = reading(payload, "memory.physical.total");
  $("mem").textContent = used ? fmtBytes(used.value) : "—";
  $("memSub").textContent = used && total ? fmtBytes(used.value) + " / " + fmtBytes(total.value) : "used / total";
  const rx = reading(payload, "net.interface.rx_rate");
  const tx = reading(payload, "net.interface.tx_rate");
  if (rx) {
    $("net").textContent = fmtBytes(rx.value) + "/s ↓ " + (tx ? fmtBytes(tx.value) + "/s ↑" : "");
    $("net").nextElementSibling.textContent = "interface: " + rx.entity_id.replace(/^if:/, "").split(":").pop();
  } else {
    $("net").textContent = "—";
  }
  const bat = reading(payload, "battery.charge");
  $("bat").textContent = bat ? bat.value.toFixed(0) + " %" : "n/a";
  const rows = $("rows");
  rows.textContent = "";
  for (const r of (payload.readings || []).slice(0, 40)) {
    const tr = document.createElement("tr");
    const td = (text, cls) => { const cell = document.createElement("td"); if (cls) cell.className = cls; cell.textContent = text; return cell; };
    tr.appendChild(td(r.metric_id));
    tr.appendChild(td(r.entity_id));
    tr.appendChild(td(String(r.value), "num"));
    tr.appendChild(td(r.unit));
    rows.appendChild(tr);
  }
}
</script>
</body>
</html>
